<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배포 파이프라인 리허설</title>
<style>
:root{
  --bg:#0f1216; --surface:#171b21; --surface-2:#1e242c; --line:#2a323c;
  --ink:#eef2f7; --sub:#9aa7b6; --accent:#4c9aff; --accent-ink:#0b1220;
  --r:14px; --sp:8px;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f6f8fb; --surface:#ffffff; --surface-2:#eef2f7; --line:#dde4ec;
         --ink:#12181f; --sub:#5b6875; --accent:#1a6fe0; --accent-ink:#ffffff; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);word-break:keep-all;
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:40px 20px 80px}
header h1{font-size:2rem;margin:0 0 8px;letter-spacing:-.02em}
header p{color:var(--sub);margin:0 0 32px}
/* 카드뉴스는 장수와 무관하게 한 줄로 떨어지게 한다.
   auto-fit+minmax는 5장일 때 4+1로 갈라져 마지막 한 장이 고아가 된다(실측). */
.gallery{display:grid;grid-template-columns:repeat(var(--gallery-n,4),1fr);gap:16px;margin-bottom:32px}
@media (max-width:900px){.gallery{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.gallery{grid-template-columns:1fr}}
.gallery img{width:100%;height:auto;display:block;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 0;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:24px}
#q{flex:1;min-width:240px;height:48px;padding:0 16px;font-size:1rem;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:10px;transition:border-color .16s ease-out}
#q:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
#count{font-weight:700;font-size:1.05rem;white-space:nowrap}
#count b{color:var(--accent)}
.btn{height:48px;padding:0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  color:var(--sub);font-size:.95rem;cursor:pointer;transition:color .16s ease-out,border-color .16s ease-out}
.btn:hover{color:var(--ink);border-color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;
  display:flex;flex-direction:column;gap:8px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{background:var(--accent);color:var(--accent-ink);
  font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px}
.badge.ok{background:#2f9e44;color:#fff}
.badge.ng{background:#e03131;color:#fff}
.rss{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.rss li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.rss a{color:var(--ink);text-decoration:none}
.rss a:hover{color:var(--accent);text-decoration:underline}
.card h3{margin:0;font-size:1.08rem;line-height:1.45}
.card p{margin:0;color:var(--sub);font-size:.94rem;line-height:1.65}
.meta{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.85rem;color:var(--sub)}
.meta span b{color:var(--ink);font-weight:600}
mark{background:color-mix(in srgb,var(--accent) 35%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.empty{grid-column:1/-1;text-align:center;padding:64px 20px;color:var(--sub);
  border:1px dashed var(--line);border-radius:var(--r)}
.embed{margin:32px 0}
.embed iframe{width:100%;min-height:420px;border:1px solid var(--line);border-radius:var(--r)}
footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);color:var(--sub);font-size:.85rem}
@media (max-width:640px){ .wrap{padding:24px 16px 64px} header h1{font-size:1.5rem} }
</style>
</head>

  <div class="toolbar">
    <input id="q" type="search" placeholder="키워드로 검색 (제목·본문)" aria-label="키워드 검색" autocomplete="off">
    <button id="reset" class="btn" type="button">초기화</button>
    <div id="count" role="status" aria-live="polite">결과 <b>5</b>건</div>
  </div>

  <main id="cards" class="cards"></main>

  <footer>AI 챔피언 블루 인증평가 · 정적 페이지 산출물 (데이터·이미지 전량 인라인, 외부 요청 없음)</footer>
</div>
<script>
const DATA = [{"조": "제1조", "제목": "배포 리허설", "본문": "이 페이지는 배포 경로를 검증하기 위한 더미 산출물이다. 실제 평가 산출물이 아니다.", "부서": "총괄"}, {"조": "제2조", "제목": "검색 동작", "본문": "키워드를 입력하면 카드가 필터링되고 결과 건수가 갱신되어야 한다.", "부서": "기술"}, {"조": "제3조", "제목": "이미지 인라인", "본문": "이미지는 base64로 문서 안에 박혀 있어 외부 요청이 발생하지 않는다.", "부서": "기술"}, {"조": "제4조", "제목": "빈 상태", "본문": "일치하는 항목이 없을 때 안내 문구가 표시되어야 한다.", "부서": "품질"}, {"조": "제5조", "제목": "모바일", "본문": "좁은 화면에서도 가로 스크롤 없이 읽혀야 한다.", "부서": "품질"}];
const FIELDS = ["제목", "본문"];
const CFG = {"badge": "조", "title": "제목", "body": "본문", "meta": ["부서"], "judge": null};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl = (s, q) => {
  s = esc(s);
  if (!q) return s;
  return s.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi'), m => `<mark>${m}</mark>`);
};
function render(q){
  q = (q || "").trim();
  const hit = !q ? DATA : DATA.filter(r =>
    FIELDS.some(f => String(r[f] ?? "").toLowerCase().includes(q.toLowerCase())));
  $("#count").innerHTML = `결과 <b>${hit.length}</b>건`;
  $("#cards").innerHTML = hit.length ? hit.map(r => {
    const badge = CFG.badge && r[CFG.badge] != null ? `<span class="badge">${esc(r[CFG.badge])}</span>` : "";
    let judge = "";
    if (CFG.judge) {
      const v = parseFloat(String(r[CFG.judge.col] ?? "").replace(/,/g, ""));
      const ok = !isNaN(v) && v <= CFG.judge.limit;
      judge = `<span class="badge ${ok ? "ok" : "ng"}">${ok ? CFG.judge.ok : CFG.judge.ng}</span>`;
    }
    const meta = CFG.meta.filter(f => r[f] != null && r[f] !== "")
      .map(f => `<span>${esc(f)} <b>${esc(r[f])}</b></span>`).join("");
    return `<article class="card"><div class="badges">${badge}${judge}</div>
      <h3>${hl(r[CFG.title], q)}</h3>
      <p>${hl(String(r[CFG.body] ?? "").slice(0, 220), q)}${String(r[CFG.body] ?? "").length > 220 ? "…" : ""}</p>
      ${meta ? `<div class="meta">${meta}</div>` : ""}</article>`;
  }).join("") : `<div class="empty">‘${esc(q)}’에 해당하는 항목이 없습니다.<br>다른 키워드로 검색해 보세요.</div>`;
}
$("#q").addEventListener("input", e => render(e.target.value));
$("#reset").addEventListener("click", () => { $("#q").value = ""; render(""); $("#q").focus(); });
render("");
</script>
